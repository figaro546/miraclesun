<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miracle Sun — Admin Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background: #0f172a; color: #e2e8f0; }
    h1 { color: #fbbf24; }
    h2 { color: #60a5fa; margin-top: 30px; }
    .stats { display: flex; gap: 20px; margin: 20px 0; }
    .stat-card { background: #1e293b; padding: 20px; border-radius: 10px; flex: 1; text-align: center; }
    .stat-card .number { font-size: 2em; font-weight: bold; color: #fbbf24; }
    .stat-card .label { color: #94a3b8; font-size: 0.9em; }
    table { width: 100%; border-collapse: collapse; margin: 10px 0; }
    th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 0.85em; }
    th { color: #60a5fa; }
    tr:hover { background: #1e293b; }
    input { padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; width: 300px; }
    button { padding: 10px 20px; border-radius: 5px; border: none; background: #3b82f6; color: white; cursor: pointer; }
    button:hover { background: #2563eb; }
    .login { text-align: center; padding: 50px; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 0.75em; }
    .badge-page { background: #1e3a5f; color: #60a5fa; }
    .badge-form { background: #1e3a1e; color: #4ade80; }
    .badge-click { background: #3a1e1e; color: #f87171; }
  </style>
</head>
<body>
  <div id="login" class="login">
    <h1>🔒 Admin Dashboard</h1>
    <p>Enter your admin password to view analytics</p>
    <input type="password" id="password" placeholder="Admin password" onkeypress="if(event.key==='Enter')doLogin()">
    <br><br>
    <button onclick="doLogin()">Login</button>
  </div>
  <div id="dashboard" style="display:none">
    <h1>☀️ Miracle Sun — Admin Dashboard</h1>
    <div class="stats" id="stats"></div>
    <h2>Top Pages</h2>
    <table id="top-pages"><thead><tr><th>Page</th><th>Views</th></tr></thead><tbody></tbody></table>
    <h2>Recent Events</h2>
    <table id="events"><thead><tr><th>Time</th><th>Type</th><th>Host</th><th>Path</th><th>Referrer</th></tr></thead><tbody></tbody></table>
  </div>
  <script>
    let token = '';
    async function doLogin() {
      token = document.getElementById('password').value;
      try {
        const res = await fetch('/api/admin/stats', { headers: { Authorization: 'Bearer ' + token } });
        if (res.status === 401) { alert('Wrong password'); return; }
        const stats = await res.json();
        document.getElementById('login').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        renderStats(stats);
        loadEvents();
      } catch (e) { alert('Login failed'); }
    }
    function renderStats(stats) {
      document.getElementById('stats').innerHTML = '<div class="stat-card"><div class="number">' + stats.pageViews + '</div><div class="label">Page Views</div></div><div class="stat-card"><div class="number">' + stats.formSubmissions + '</div><div class="label">Form Submissions</div></div><div class="stat-card"><div class="number">' + stats.clicks + '</div><div class="label">Clicks</div></div>';
      document.querySelector('#top-pages tbody').innerHTML = (stats.topPages || []).map(function(p) { return '<tr><td>' + p.path + '</td><td>' + p.c + '</td></tr>'; }).join('');
    }
    async function loadEvents() {
      const res = await fetch('/api/admin/events?limit=100', { headers: { Authorization: 'Bearer ' + token } });
      const data = await res.json();
      document.querySelector('#events tbody').innerHTML = (data.events || []).map(function(e) {
        const badge = e.type === 'form_submission' ? 'badge-form' : e.type === 'click' ? 'badge-click' : 'badge-page';
        return '<tr><td>' + e.created_at + '</td><td><span class="badge ' + badge + '">' + e.type + '</span></td><td>' + e.host + '</td><td>' + e.path + '</td><td>' + (e.referrer || '') + '</td></tr>';
      }).join('');
    }
  </script>
</body>
</html>
